[defaults]
# ===== 核心路径配置 =====
# 必须显式指定挂载路径（关键！避免容器内路径混淆）
inventory = /etc/ansible/hosts
roles_path = /etc/ansible/roles:/usr/share/ansible/roles
library = /etc/ansible/modules:/usr/share/ansible/modules

# ===== 安全加固 =====
# 禁用 SSH 主机密钥检查（容器内无 known_hosts）
host_key_checking = False
# 禁止生成 .retry 文件（避免敏感信息泄露）
retry_files_enabled = False
# 阻止临时文件全局可读
allow_world_readable_tmpfiles = False
# 强制使用指定私钥（需提前挂载）
private_key_file = /etc/ansible/ssh/id_rsa

# ===== 性能优化 =====
# 并行任务数（根据宿主机CPU核心数调整）
forks = 30
# SSH 连接超时（秒），避免卡死
timeout = 10
# 仅首次收集 facts，后续复用
gathering = smart
# 启用 facts 缓存
fact_caching = jsonfile
# 缓存目录（需挂载宿主机目录）
fact_caching_connection = /etc/ansible/facts

# ===== 日志与错误处理 =====
# 集中日志（需确保容器内可写）
log_path = /var/log/ansible.log
# 友好格式化输出（替代默认杂乱输出）
stdout_callback = yaml
# 变量未定义时立即报错（防止隐蔽错误）
error_on_undefined_vars = True

# ===== 禁用高风险功能 =====
# 阻止覆盖敏感文件（如 /etc/passwd）
allow_unsafe_writes = False
# 禁用 Jinja2 自动类型转换（避免安全漏洞）
jinja2_native = True
# 屏蔽过时警告（减少日志噪音）
deprecation_warnings = False

# ===== 容器环境特化 =====
# 避免使用 /root（容器内无持久化）
remote_tmp = /tmp/.ansible
# 强制模块使用 UTF-8 环境
module_set_locale = True
